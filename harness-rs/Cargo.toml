[package]
name = "qwen-harness"
version = "0.1.0"
edition = "2024"
description = "Hybrid Rust Core Orchestrator + Python AST Sandbox Worker for LLM coding evaluation & self-repair"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
